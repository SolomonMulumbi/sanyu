<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SANYU HOSPITAL | Marketeer Login</title>

  <link
    rel="icon"
    type="image/png"
    href="icon.png"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="icon.png"
  >

  <link
    rel="apple-touch-icon"
    href="icon.png"
  >

  <link
    rel="stylesheet"
    href="css/style.css?v=21"
  >
</head>


<body class="auth-page">

<main class="auth-container">

  <!-- BRAND SECTION -->

  <section class="brand-section">

    <div class="medical-logo">
      +
    </div>

    <h1>
      SANYU HOSPITAL
    </h1>

    <p>
      Community Marketing Program
    </p>

    <div class="brand-message">

      <h2>
        Better Healthcare
      </h2>

      <h2>
        Stronger Communities
      </h2>

    </div>

  </section>


  <!-- LOGIN CARD -->

  <section class="login-card">

    <h2>
      Marketeer Login
    </h2>

    <p>
      Sign in to continue
    </p>


    <form id="loginForm">

      <div class="form-group">

        <label for="loginEmail">
          Email Address
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        class="primary-btn"
      >
        Login
      </button>

    </form>


    <p id="loginMessage"></p>


    <button
      type="button"
      id="createAccountBtn"
      class="secondary-btn"
    >
      Create Account
    </button>

  </section>

</main>


<!-- LOAD JAVASCRIPT ONCE ONLY -->

<script
  src="script.js?v=21"
  type="module">
</script>

</body>
</html>
