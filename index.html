<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibo Medical System | Rider Program</title>
<link rel="stylesheet" href="css/style.css?v=11"></head>

<body class="auth-page">

<main class="auth-container">

  <section class="brand-section">
    <div class="medical-logo">+</div>

    <h1>Bibo Medical System</h1>
    <p>Boda Boda Rider Program</p>

    <div class="brand-message">
      <h2>Healthy Riders</h2>
      <h2>Stronger Communities</h2>
    </div>
  </section>

  <section class="login-card">

    <h2>Marketeer Login</h2>
    <p>Sign in to continue</p>

    <form id="loginForm">
    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="primary-btn">Login</button>
</form>

<p id="loginMessage"></p>

<button type="button" id="createAccountBtn" class="secondary-btn">Create Account</button>

<script type="module" src="script.js"></script>


  </section>

</main>

<script src="script.js?v=8" type="module"></script></body>
</html>
