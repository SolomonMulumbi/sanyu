<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Stage</title>
  <link rel="stylesheet" href="css/style.css?v=8">
</head>

<body>

<header class="page-header">
  <a href="stages.html">←</a>
  <h1>Register Stage</h1>
</header>

<main class="app-content">

<form id="stageRegistrationForm">

  <div class="form-group">
    <label for="stageName">Stage Name *</label>
    <input
      type="text"
      id="stageName"
      placeholder="Example: Entebbe Airport Stage"
      required
    >
  </div>

  <div class="form-group">
    <label for="stageArea">Area / Location *</label>
    <input
      type="text"
      id="stageArea"
      placeholder="Example: Entebbe"
      required
    >
  </div>

  <div class="form-group">
    <label for="chairmanName">
      Chairman / Stage Leader *
    </label>

    <input
      type="text"
      id="chairmanName"
      placeholder="Chairman's full name"
      required
    >
  </div>

  <div class="form-group">
    <label for="chairmanPhone">
      Chairman Phone *
    </label>

    <input
      type="tel"
      id="chairmanPhone"
      placeholder="07XX XXX XXX"
      required
    >
  </div>

  <div class="form-group">
    <label for="stageDistrict">District</label>

    <input
      type="text"
      id="stageDistrict"
      placeholder="Example: Wakiso"
    >
  </div>

  <div class="form-group">
    <label for="stageNotes">Notes</label>

    <textarea
      id="stageNotes"
      placeholder="Additional information about the stage">
    </textarea>
  </div>

  <button
    type="submit"
    id="saveStageBtn"
    class="primary-btn">
    Register Stage
  </button>

</form>

</main>

<script src="script.js" type="module"></script>
</body>
</html>
