<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Registrations | SANYU HOSPITAL</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="css/style.css?v=21">
</head>

<body>

<header class="page-header">

  <a
    href="dashboard.html"
    class="back-btn"
    aria-label="Back to dashboard">
    ←
  </a>

  <h1>My Registrations</h1>

</header>


<main class="app-content">

  <!-- REGISTRATION SUMMARY -->

  <section class="registration-summary">

    <div class="registration-summary-card">

      <span class="summary-icon">
        👥
      </span>

      <div>

        <small>
          Total Registered
        </small>

        <strong id="totalClients">
          0
        </strong>

      </div>

    </div>


    <div class="registration-summary-card">

      <span class="summary-icon">
        ✓
      </span>

      <div>

        <small>
          Verified / Approved
        </small>

        <strong id="verifiedClients">
          0
        </strong>

      </div>

    </div>

  </section>


  <!-- CATEGORY FILTERS -->

  <div class="client-tabs">

    <button
      type="button"
      class="client-tab active"
      data-filter="all">
      All
    </button>


    <button
      type="button"
      class="client-tab"
      data-filter="rider">
      Riders
    </button>


    <button
      type="button"
      class="client-tab"
      data-filter="pregnant">
      Pregnant Women
    </button>


    <button
      type="button"
      class="client-tab"
      data-filter="pending">
      Pending
    </button>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="search"
      id="clientSearch"
      placeholder="Search name or phone number..."
      autocomplete="off"
    >

  </div>


  <!-- REGISTRATION LIST -->

  <section id="clientsList">

    <div class="empty-state">

      <div class="empty-icon">
        👥
      </div>

      <h3>
        Loading registrations...
      </h3>

      <p>
        Please wait while we prepare your records.
      </p>

    </div>

  </section>

</main>


<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">

  <a
    href="dashboard.html"
    class="nav-item">

    <span>⌂</span>
    <small>Home</small>

  </a>


  <a
    href="register-rider.html"
    class="nav-item">

    <span>＋</span>
    <small>Register</small>

  </a>


  <a
    href="riders.html"
    class="nav-item active">

    <span>♙</span>
    <small>Registrations</small>

  </a>


  <a
    href="stages.html"
    class="nav-item">

    <span>⌖</span>
    <small>Stages</small>

  </a>


  <a
    href="profile.html"
    class="nav-item">

    <span>●</span>
    <small>Profile</small>

  </a>

</nav>


<script src="script.js?v=21" type="module"></script>

</body>
</html>
