<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Marketeer Account | SANYU HOSPITAL</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="css/style.css?v=21">
</head>

<body>

<header class="page-header">

  <a href="index.html" class="back-btn">←</a>

  <h1>Create Account</h1>

</header>


<main class="app-content">

  <form id="marketeerRegistrationForm">

    <div class="form-group">

      <label for="marketeerFullName">
        Full Name *
      </label>

      <input
        type="text"
        id="marketeerFullName"
        autocomplete="name"
        required
      >

    </div>


    <div class="form-group">

      <label for="marketeerPhone">
        Phone Number *
      </label>

      <input
        type="tel"
        id="marketeerPhone"
        placeholder="07XX XXX XXX"
        autocomplete="tel"
        required
      >

    </div>


    <div class="form-group">

      <label for="marketeerEmail">
        Email
      </label>

      <input
        type="email"
        id="marketeerEmail"
        placeholder="example@email.com"
        autocomplete="email"
      >

    </div>


    <div class="form-group">

      <label for="marketeerPassword">
        Password *
      </label>

      <input
        type="password"
        id="marketeerPassword"
        autocomplete="new-password"
        required
      >

    </div>


    <div class="form-group">

      <label for="confirmPassword">
        Confirm Password *
      </label>

      <input
        type="password"
        id="confirmPassword"
        autocomplete="new-password"
        required
      >

    </div>


    <button
      type="submit"
      id="createMarketeerBtn"
      class="primary-btn">
      Create Account
    </button>

  </form>

</main>


<script src="script.js?v=21" type="module"></script>

</body>
</html>
