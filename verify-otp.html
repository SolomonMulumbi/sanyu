<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verify Registration | SANYU HOSPITAL</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="css/style.css?v=21">
</head>

<body>

<header class="page-header">

  <a
    href="register-rider.html"
    class="back-btn"
    aria-label="Back to registration">
    ←
  </a>

  <h1>Verify Registration</h1>

</header>


<main class="otp-container">

  <!-- OTP HEADER -->

  <div class="otp-icon">
    📱
  </div>

  <span class="registration-label">
    PHONE VERIFICATION
  </span>

  <h1>
    Enter Verification Code
  </h1>

  <p id="otpDescription">
    Enter the 6-digit verification code sent to
  </p>

  <strong id="otpPhoneNumber">
    07XX XXX XXX
  </strong>


  <!-- REGISTRATION INFORMATION -->

  <div class="otp-registration-info">

    <span id="otpRegistrationType">
      Registration
    </span>

    <strong id="otpRegistrationName"></strong>

  </div>


  <!-- RECAPTCHA -->

  <div class="recaptcha-section">

    <div
      id="recaptchaLoading"
      class="recaptcha-loading">

      <div class="recaptcha-spinner"></div>

      <div>

        <strong>
          Preparing security check...
        </strong>

        <span>
          Please wait a moment
        </span>

      </div>

    </div>


    <div
      id="recaptcha-container"
      class="recaptcha-box">
    </div>

  </div>


  <!-- SEND OTP -->

  <button
    type="button"
    id="sendOtpBtn"
    class="primary-btn"
    disabled>
    Send Verification Code
  </button>


  <!-- OTP FORM -->

  <form id="otpForm">

    <div class="otp-inputs">

      <input
        type="text"
        maxlength="1"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="one-time-code"
        class="otp-digit"
        aria-label="Verification digit 1"
      >

      <input
        type="text"
        maxlength="1"
        inputmode="numeric"
        pattern="[0-9]*"
        class="otp-digit"
        aria-label="Verification digit 2"
      >

      <input
        type="text"
        maxlength="1"
        inputmode="numeric"
        pattern="[0-9]*"
        class="otp-digit"
        aria-label="Verification digit 3"
      >

      <input
        type="text"
        maxlength="1"
        inputmode="numeric"
        pattern="[0-9]*"
        class="otp-digit"
        aria-label="Verification digit 4"
      >

      <input
        type="text"
        maxlength="1"
        inputmode="numeric"
        pattern="[0-9]*"
        class="otp-digit"
        aria-label="Verification digit 5"
      >

      <input
        type="text"
        maxlength="1"
        inputmode="numeric"
        pattern="[0-9]*"
        class="otp-digit"
        aria-label="Verification digit 6"
      >

    </div>


    <!-- OTP MESSAGE -->

    <div id="otpMessage"></div>


    <!-- RESEND -->

    <p class="resend-text">

      Didn't receive the code?

      <button
        type="button"
        id="resendOtpBtn">
        Resend code
      </button>

    </p>


    <!-- VERIFY -->

    <button
      type="submit"
      id="verifyOtpBtn"
      class="primary-btn">
      Verify & Continue
    </button>

  </form>

</main>


<script src="script.js?v=21" type="module"></script>

</body>
</html>
