<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Bibo Medical System</title>
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

<div class="app-container">

    <header class="page-header">
        <a href="dashboard.html" class="back-btn">←</a>
        <h2>Profile</h2>
        <div></div>
    </header>

    <main class="main-content">

        <div class="profile-header">
            <div class="profile-avatar" id="profileInitials">BM</div>

            <h2 id="profileName">Marketer</h2>

            <p>Bibo Medical System</p>
        </div>

        <section class="section">
            <h3 class="section-title">Account</h3>

            <div class="settings-list">

                <button class="settings-item" id="myInformationBtn">
                    <div>
                        <strong>My Information</strong>
                        <span>View your account information</span>
                    </div>
                    <span>›</span>
                </button>

                <button class="settings-item" id="changePasswordBtn">
                    <div>
                        <strong>Change Password</strong>
                        <span>Reset your account password</span>
                    </div>
                    <span>›</span>
                </button>

                <button class="settings-item" id="notificationsBtn">
                    <div>
                        <strong>Notifications</strong>
                        <span>Manage your notifications</span>
                    </div>
                    <span>›</span>
                </button>

            </div>
        </section>

        <section class="section">
            <h3 class="section-title">Other</h3>

            <div class="settings-list">

                <button class="settings-item" id="aboutBtn">
                    <div>
                        <strong>About</strong>
                        <span>About the Boda Boda Program</span>
                    </div>
                    <span>›</span>
                </button>

            </div>
        </section>

        <button class="secondary-btn logout-btn" id="logoutBtn">
            Logout
        </button>

    </main>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <span>⌂</span>
            <small>Home</small>
        </a>

        <a href="register-rider.html" class="nav-item">
            <span>＋</span>
            <small>Register</small>
        </a>

        <a href="riders.html" class="nav-item">
            <span>♙</span>
            <small>Riders</small>
        </a>

        <a href="stages.html" class="nav-item">
            <span>⌖</span>
            <small>Stages</small>
        </a>

        <a href="profile.html" class="nav-item active">
            <span>●</span>
            <small>Profile</small>
        </a>
    </nav>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
