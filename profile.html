<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | SANYU HOSPITAL</title>

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="shortcut icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="css/style.css?v=21">
</head>

<body>

<div class="app-container">

    <!-- PAGE HEADER -->

    <header class="page-header">

        <a
            href="dashboard.html"
            class="back-btn"
            aria-label="Back to dashboard">
            ←
        </a>

        <h2>Profile</h2>

        <div></div>

    </header>


    <!-- MAIN CONTENT -->

    <main class="main-content">

        <!-- PROFILE HEADER -->

        <div class="profile-header">

            <div
                class="profile-avatar"
                id="profileInitials">
                BM
            </div>

            <h2 id="profileName">
                Marketer
            </h2>

            <p>
                SANYU HOSPITAL
            </p>

        </div>


        <!-- ACCOUNT SETTINGS -->

        <section class="section">

            <h3 class="section-title">
                Account
            </h3>

            <div class="settings-list">

                <button
                    type="button"
                    class="settings-item"
                    id="myInformationBtn">

                    <div>
                        <strong>My Information</strong>
                        <span>View your account information</span>
                    </div>

                    <span>›</span>

                </button>


                <button
                    type="button"
                    class="settings-item"
                    id="changePasswordBtn">

                    <div>
                        <strong>Change Password</strong>
                        <span>Reset your account password</span>
                    </div>

                    <span>›</span>

                </button>


                <button
                    type="button"
                    class="settings-item"
                    id="notificationsBtn">

                    <div>
                        <strong>Notifications</strong>
                        <span>Manage your notifications</span>
                    </div>

                    <span>›</span>

                </button>

            </div>

        </section>


        <!-- OTHER SETTINGS -->

        <section class="section">

            <h3 class="section-title">
                Other
            </h3>

            <div class="settings-list">

                <button
                    type="button"
                    class="settings-item"
                    id="aboutBtn">

                    <div>
                        <strong>About</strong>
                        <span>About the Community Marketing Program</span>
                    </div>

                    <span>›</span>

                </button>

            </div>

        </section>


        <!-- LOGOUT -->

        <button
            type="button"
            class="secondary-btn logout-btn"
            id="logoutBtn">
            Logout
        </button>

    </main>


    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">

        <a
            href="dashboard.html"
            class="nav-item">

            <span>⌂</span>
            <small>Home</small>

        </a>


        <a
            href="register-rider.html"
            class="nav-item">

            <span>＋</span>
            <small>Register</small>

        </a>


        <a
            href="riders.html"
            class="nav-item">

            <span>♙</span>
            <small>Registrations</small>

        </a>


        <a
            href="stages.html"
            class="nav-item">

            <span>⌖</span>
            <small>Stages</small>

        </a>


        <a
            href="profile.html"
            class="nav-item active">

            <span>●</span>
            <small>Profile</small>

        </a>

    </nav>

</div>


<script src="script.js?v=21" type="module"></script>

</body>
</html>
