<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Successful</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="success-container">

  <div class="success-icon">✓</div>

  <h1>Rider Registered!</h1>

  <h2 id="registeredRiderName">
    Rider Name
  </h2>

  <div class="rider-summary">

    <p>
      Phone:
      <strong id="registeredRiderPhone"></strong>
    </p>

    <p>
      Stage:
      <strong id="registeredRiderStage"></strong>
    </p>

  </div>

  <div class="commission-card">

    <span>Registration Reward</span>

    <strong>
      UGX <span id="earnedCommission">1,000</span>
    </strong>

    <small>
      Commission added to your account
    </small>

  </div>

  <div class="discount-message">
    This rider is now eligible for approved Bibo Medical
    Boda Boda healthcare discounts.
  </div>

  <a
    href="register-rider.html"
    class="primary-btn">
    Register Another Rider
  </a>

  <a
    href="riders.html"
    class="secondary-btn">
    View Registered Riders
  </a>

</main>

<script src="script.js" type="module"></script>
</body>
</html>
