<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registration Successful | SANYU HOSPITAL</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="css/style.css?v=21">
</head>

<body>

<main class="success-container">

  <!-- SUCCESS ICON -->

  <div class="success-icon">
    ✓
  </div>


  <!-- REGISTRATION MESSAGE -->

  <h1 id="registrationSuccessTitle">
    Registration Successful!
  </h1>

  <h2 id="registeredRiderName">
    Registered Client
  </h2>


  <!-- CLIENT SUMMARY -->

  <div class="rider-summary">

    <p>
      Phone:
      <strong id="registeredRiderPhone">
        -
      </strong>
    </p>

    <p id="registeredStageRow">
      Stage:
      <strong id="registeredRiderStage">
        -
      </strong>
    </p>

  </div>


  <!-- COMMISSION / STATUS -->

  <div
    class="commission-card"
    id="registrationCommissionCard">

    <span id="registrationRewardLabel">
      Registration Reward
    </span>

    <strong>
      UGX <span id="earnedCommission">0</span>
    </strong>

    <small id="registrationRewardMessage">
      Commission status will appear here.
    </small>

  </div>


  <!-- PROGRAM MESSAGE -->

  <div
    class="discount-message"
    id="registrationSuccessMessage">

    Registration completed successfully.

  </div>


  <!-- ACTIONS -->

  <a
    href="register-rider.html"
    class="primary-btn"
    id="registerAnotherBtn">
    New Registration
  </a>

  <a
    href="riders.html"
    class="secondary-btn">
    View My Registrations
  </a>

</main>


<script src="script.js?v=21" type="module"></script>

</body>
</html>
