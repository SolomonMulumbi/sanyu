<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rider Details | SANYU HOSPITAL</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="css/style.css?v=21">
</head>

<body>

<header class="page-header">

  <a
    href="riders.html"
    class="back-btn"
    aria-label="Back to registrations">
    ←
  </a>

  <h1>Rider Details</h1>

</header>


<main class="app-content">

  <!-- RIDER PROFILE -->

  <section class="profile-card">

    <div class="rider-avatar">
      👤
    </div>

    <h1 id="detailRiderName">
      Rider Name
    </h1>

    <span
      id="riderStatus"
      class="status-badge pending">
      Pending
    </span>

  </section>


  <!-- RIDER DETAILS -->

  <section class="details-card">

    <div class="detail-row">

      <span>Phone</span>

      <strong id="detailPhone">
        -
      </strong>

    </div>


    <div class="detail-row">

      <span>National ID / NIN</span>

      <strong id="detailNationalId">
        -
      </strong>

    </div>


    <div class="detail-row">

      <span>Boda Boda Stage</span>

      <strong id="detailStage">
        -
      </strong>

    </div>


    <div class="detail-row">

      <span>Registered On</span>

      <strong id="detailRegistrationDate">
        -
      </strong>

    </div>


    <div class="detail-row">

      <span>Registered By</span>

      <strong id="detailMarketeer">
        -
      </strong>

    </div>


    <div class="detail-row">

      <span>Phone Verification</span>

      <strong id="detailOtpStatus">
        Pending
      </strong>

    </div>

  </section>

</main>


<script src="script.js?v=21" type="module"></script>

</body>
</html>
