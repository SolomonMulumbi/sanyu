<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Details</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="page-header">
  <a href="riders.html">←</a>
  <h1>Rider Details</h1>
</header>

<main class="app-content">

  <section class="profile-card">

    <div class="rider-avatar">👤</div>

    <h1 id="detailRiderName">Rider Name</h1>

    <span
      id="riderStatus"
      class="status-badge verified">
      Verified
    </span>

  </section>

  <section class="details-card">

    <div class="detail-row">
      <span>Phone</span>
      <strong id="detailPhone">-</strong>
    </div>

    <div class="detail-row">
      <span>National ID</span>
      <strong id="detailNationalId">-</strong>
    </div>

    <div class="detail-row">
      <span>Stage</span>
      <strong id="detailStage">-</strong>
    </div>

    <div class="detail-row">
      <span>Motorcycle</span>
      <strong id="detailMotorcycle">-</strong>
    </div>

    <div class="detail-row">
      <span>Registered On</span>
      <strong id="detailRegistrationDate">-</strong>
    </div>

    <div class="detail-row">
      <span>Registered By</span>
      <strong id="detailMarketeer">-</strong>
    </div>

    <div class="detail-row">
      <span>OTP Verified</span>
      <strong id="detailOtpStatus">-</strong>
    </div>

  </section>

</main>

<script src="script.js" type="module"></script>
</body>
</html>
